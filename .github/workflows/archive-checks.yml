name: Archive checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check archive behavior
        run: python3 -m unittest discover -s tests -v
      - name: Validate metadata and published history
        env:
          ARCHIVE_BASE: ${{ github.event.pull_request.base.sha }}
          ARCHIVE_REVISION: ${{ github.sha }}
        run: python3 scripts/build_archive.py --base "$ARCHIVE_BASE" --revision "$ARCHIVE_REVISION" --repository "$GITHUB_REPOSITORY"

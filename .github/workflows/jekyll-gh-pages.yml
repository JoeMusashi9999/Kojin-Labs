# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check archive behavior
        run: python3 -m unittest discover -s tests -v
      - name: Validate and index the archive
        env:
          ARCHIVE_BASE: ${{ github.event.before }}
          ARCHIVE_REVISION: ${{ github.sha }}
        run: |
          if [ -z "$ARCHIVE_BASE" ]; then
            ARCHIVE_BASE=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          python3 scripts/build_archive.py --base "$ARCHIVE_BASE" --revision "$ARCHIVE_REVISION" --repository "$GITHUB_REPOSITORY"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Copy archive snapshots without Jekyll processing
        run: |
          rm -rf _site/archive-content
          cp -R archive-content _site/archive-content
          cp archive/manifest.json _site/archive/manifest.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
